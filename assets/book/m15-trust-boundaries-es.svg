    <rect x="280" y="165" width="155" height="105" rx="16" class="accent"/><text x="357" y="210" text-anchor="middle" class="t">Gateway</text><text x="357" y="239" text-anchor="middle" class="s">autenticar</text>
    <rect x="515" y="165" width="155" height="105" rx="16" class="accent"/><text x="592" y="210" text-anchor="middle" class="t">Servicio</text><text x="592" y="239" text-anchor="middle" class="s">autorizar</text>
    <rect x="750" y="165" width="155" height="105" rx="16" class="box"/><text x="827" y="210" text-anchor="middle" class="t">Almacenamiento</text><text x="827" y="239" text-anchor="middle" class="s">estado durable</text>
    <path d="M205 218 H270 M435 218 H505 M670 218 H740" class="teal"/>
    <path d="M245 105 V330 M475 105 V330 M710 105 V330" class="dash"/>
    <text x="245" y="92" text-anchor="middle" class="m">IDENTIDAD</text><text x="475" y="92" text-anchor="middle" class="m">AUTORIDAD</text><text x="710" y="92" text-anchor="middle" class="m">CONFIANZA DEL SERVICIO</text>
    <rect x="150" y="365" width="660" height="58" rx="12" class="soft"/><text x="480" y="399" text-anchor="middle" class="t">alcanzable ≠ autenticado ≠ autorizado</text>
  </svg>