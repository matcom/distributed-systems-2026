    <text x="710" y="90" text-anchor="middle" class="t">Majority · 3/5</text>
    <circle cx="175" cy="195" r="58" class="node"/><circle cx="330" cy="300" r="58" class="node"/>
    <circle cx="610" cy="190" r="58" class="node"/><circle cx="760" cy="190" r="58" class="accent"/><circle cx="685" cy="330" r="58" class="node"/>
    <text x="175" y="202" text-anchor="middle" class="t">A</text><text x="330" y="307" text-anchor="middle" class="t">B</text>
    <text x="610" y="197" text-anchor="middle" class="t">C</text><text x="760" y="197" text-anchor="middle" class="t">D</text><text x="685" y="337" text-anchor="middle" class="t">E</text>
    <text x="175" y="270" text-anchor="middle" class="s">old leader</text><text x="760" y="270" text-anchor="middle" class="s">new leader</text>
    <rect x="95" y="370" width="285" height="55" rx="12" class="soft"/><text x="238" y="404" text-anchor="middle" class="m">ALIVE ≠ CAN COMMIT</text>
    <rect x="555" y="370" width="315" height="55" rx="12" class="accent"/><text x="712" y="404" text-anchor="middle" class="m">MAJORITY CAN MAKE PROGRESS</text>
